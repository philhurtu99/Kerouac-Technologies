services:
  website:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kerouac-technologies-site
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:4343:8080"
    networks:
      - kerouac-public

networks:
  kerouac-public:
    external: true
